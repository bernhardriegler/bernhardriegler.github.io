<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <label for="yearInput">Year:</label>
    <input id="yearInput" type="number" step="1" min="1583" value="" placeholder="Enter year" />
    <div id="result"></div>
    <script>
        // Anonymous Gregorian Easter algorithm
        function easter(year) {
            const a = year % 19;
            const b = Math.floor(year / 100);
            const c = year % 100;
            const d = Math.floor(b / 4);
            const e = b % 4;
            const f = Math.floor((b + 8) / 25);
            const g = Math.floor((b - f + 1) / 3);
            const h = (19 * a + b - d - g + 15) % 30;
            const i = Math.floor(c / 4);
            const k = c % 4;
            const l = (32 + 2 * e + 2 * i - h - k) % 7;
            const m = Math.floor((a + 11 * h + 22 * l) / 451);
            const month = Math.floor((h + l - 7 * m + 114) / 31);
            const day = ((h + l - 7 * m + 114) % 31) + 1;
            return new Date(year, month - 1, day);
        }

        function updateResult() {
            const year = parseInt(document.getElementById('yearInput').value, 10);
            const resultDiv = document.getElementById('result');
            if (!isNaN(year)) {
                const easterDate = easter(year);
                resultDiv.innerHTML = `<h1>Easter in ${year}</h1><p>${easterDate.toDateString()}</p>`;
            } else {
                resultDiv.innerHTML = '';
            }
        }

        document.getElementById('yearInput').addEventListener('input', updateResult);

        // Set current year as default
        document.getElementById('yearInput').value = new Date().getFullYear();
        updateResult();
    </script>
</body>

</html>
